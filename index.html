 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My 3D Trophy</title>
  <!-- Import the 3D Viewer library -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
  <style>
    body { margin: 0; background-color: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    model-viewer { width: 50%; height: 50%; --poster-color: transparent; }
  </style>
</head>
<body>
  <table align="center" border="0" cellpadding="0" cellspacing="0" style="border-collapse: collapse;">
  <tr>
         <td>
   
<img src="https://imgur.com/ZfcZJSk.png" style="display: block; max-width: 600px">
         </td>
  </tr>

  
  <model-viewer 
    src="./gold-trophy.glb" 
    ar 
    camera-controls 
    auto-rotate 
    rotation-interval="3000"
    shadow-intensity="1">
  </model-viewer>

</body>
</html>
</html>
