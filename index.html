<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My 3D Trophy</title>
  
  <!-- Import the 3D Viewer library -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>

  <style>
    body { 
      margin: 0; 
      background-color: #111; 
      display: flex; 
      flex-direction: column; /* Stacks elements vertically */
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      overflow: hidden; 
      gap: 10px; /* Space between the images and the 3D model */
    }

    .banner-img {
      max-width: 600px;
      width: 90%;
      height: auto;
      display: block;
    }

    model-viewer { 
      width: 50%; 
      height: 35vh; /* Adjusted height so everything fits in the viewport */
      --poster-color: transparent; 
    }
  </style>
</head>
<body>

  <!-- Top Image -->
  <img src="https://i.imgur.com/ZfcZJSk.png" alt="Top Image" class="banner-img">

  <!-- 3D Model Viewer -->
  <model-viewer 
    src="./gold-trophy.glb" 
    ar 
    camera-controls 
    auto-rotate 
    rotation-interval="3000"
    shadow-intensity="1">
  </model-viewer>

  <!-- Bottom Image (Replace src with your second image link if needed) -->
  <img src="https://i.imgur.com/ZfcZJSk.png" alt="Bottom Image" class="banner-img">

</body>
</html>
